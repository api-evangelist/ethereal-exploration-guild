name: Ethereal Exploration Guild
description: 'Ethereal Exploration Guild (EtherealX) is an Indian spacetech company founded in 2022 in
  Bengaluru by Manu J. Nair, Prashant Sharma, and Shubhayu Sardar, building fully reusable medium-lift
  launch vehicles. Its lead product, the Razor Crest Mk-1 (RCM1), targets roughly 25 tons to low Earth
  orbit with high launch cadence, up to 16 orbit insertions per flight, and 72-96 hour turnaround. The
  company has manufactured its 80kN reusable upper-stage engine (Pegasus) using a proprietary Full Flow
  Segregated Cooling Cycle (FFSCC) and operates a large private rocket testing facility in Cuddalore,
  Tamil Nadu. EtherealX has raised on the order of $26M across multiple rounds, including a Series A in
  December 2025. The company offers launch services rather than any developer-facing API or platform.'
